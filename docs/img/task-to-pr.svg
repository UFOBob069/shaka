<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 432" width="360" role="img" aria-labelledby="t d">
<title id="t">From task to pull request</title>
<desc id="d">You give a task. The agent builds, verifies, and reviews, repeating tests and review, with screenshots for UI changes. You review one clear pull request with a walkthrough, check and review results, and the decisions left for you, then decide what happens next.</desc>
<style>
.bg{fill:#fff;stroke:#d9e0e7}
text{font-family:ui-sans-serif,-apple-system,"Segoe UI",Helvetica,Arial,sans-serif;fill:#0f1724}
.h{font-size:15px;font-weight:600}
.s{font-size:13px}
.l{font-size:11px;letter-spacing:.08em}
.m{fill:#516074}
.you rect{fill:#fdf3df;stroke:#b87514;stroke-width:1}
.agent rect{fill:#f1f4f8;stroke:#8a99ad;stroke-width:1}
.pr rect{fill:#e3f5ec;stroke:#128a5e;stroke-width:2}
.ok{fill:#128a5e;font-weight:700}
.a{stroke:#516074;stroke-width:1.5;fill:none}
.ah{fill:#516074}
@media (prefers-color-scheme:dark){
.bg{fill:#0f1724;stroke:#2a3648}
text{fill:#e6edf5}
.m{fill:#9fb0c3}
.you rect{fill:#40300f;stroke:#e0a13a}
.agent rect{fill:#1a2535;stroke:#6b7c93}
.pr rect{fill:#0e3d2c;stroke:#3ccf92}
.ok{fill:#3ccf92}
.a{stroke:#9fb0c3}
.ah{fill:#9fb0c3}
}
</style>
<defs><marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path class="ah" d="M0 0L10 5L0 10z"/></marker></defs>
<rect class="bg" x="0.5" y="0.5" width="359" height="431" rx="10"/>
<g class="you"><rect x="20" y="20" width="320" height="76" rx="8"/>
<text class="l m" x="38" y="44">YOU</text>
<text class="h" x="38" y="66">Give a task</text>
<text class="s m" x="38" y="85">An issue or a sentence</text></g>
<path class="a" d="M180 98V124" marker-end="url(#ar)"/>
<g class="agent"><rect x="20" y="126" width="320" height="94" rx="8"/>
<text class="l m" x="38" y="150">AGENT</text>
<text class="h" x="38" y="172">Build, verify, review</text>
<text class="s m" x="38" y="191">↻ Tests and review repeat</text>
<text class="s m" x="38" y="209">Screenshots for UI changes</text></g>
<path class="a" d="M180 222V248" marker-end="url(#ar)"/>
<g class="pr"><rect x="20" y="250" width="320" height="162" rx="8"/>
<text class="l m" x="38" y="274">YOU</text>
<text class="h" x="38" y="296">Review one clear PR</text>
<text class="s" x="38" y="318"><tspan class="ok">•</tspan> Walkthrough</text>
<text class="s" x="38" y="337"><tspan class="ok">•</tspan> Check and review results</text>
<text class="s" x="38" y="356"><tspan class="ok">•</tspan> Decisions for you</text>
<text class="s m" x="38" y="384">Decide what happens next</text></g>
</svg>
