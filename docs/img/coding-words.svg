<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 464" width="360" role="img" aria-labelledby="t d">
<title id="t">Eight words you will see</title>
<desc id="d">Repo: your project on GitHub, short for repository. Commit: a save point, like saving a game. main: the real version of your project. Branch: a practice copy for trying changes safely. Pull request: a permission slip asking whether these changes may join main. Check: a robot test that says pass or fail. Review: a second AI reads the change, looking for mistakes. Merge: the changes join main; with Ask, that waits for your yes.</desc>
<style>
.bg{fill:#fff;stroke:#d9e0e7}
text{font-family:ui-sans-serif,-apple-system,"Segoe UI",Helvetica,Arial,sans-serif;fill:#0f1724}
.h{font-size:15px;font-weight:600}
.s{font-size:12px}
.m{fill:#516074}
.card{fill:#f1f4f8;stroke:#8a99ad;stroke-width:1}
.ic{fill:none;stroke:#516074;stroke-width:2;stroke-linejoin:round;stroke-linecap:round}
.mn{fill:none;stroke:#128a5e;stroke-width:3;stroke-linecap:round}
.br{fill:none;stroke:#2f6fd1;stroke-width:3;stroke-linecap:round}
.ok{fill:none;stroke:#128a5e;stroke-width:2.5;stroke-linecap:round;stroke-linejoin:round}
.dm{fill:#128a5e}
.db{fill:#2f6fd1}
.dk{fill:#516074}
@media (prefers-color-scheme:dark){
.bg{fill:#0f1724;stroke:#2a3648}
text{fill:#e6edf5}
.m{fill:#9fb0c3}
.card{fill:#1a2535;stroke:#6b7c93}
.ic{stroke:#9fb0c3}
.mn,.ok{stroke:#3ccf92}
.br{stroke:#6ea2ff}
.dm{fill:#3ccf92}
.db{fill:#6ea2ff}
.dk{fill:#9fb0c3}
}
</style>
<rect class="bg" x="0.5" y="0.5" width="359" height="463" rx="10"/>
<g transform="translate(20 20)"><rect class="card" width="156" height="100" rx="8"/>
<g transform="translate(12 12)"><path class="ic" d="M2 5h7l2 3h11v13H2z"/></g>
<text class="h" x="44" y="30">Repo</text>
<text class="s m" x="12" y="56">Your project on</text>
<text class="s m" x="12" y="72">GitHub. Short for</text>
<text class="s m" x="12" y="88">repository.</text></g>
<g transform="translate(184 20)"><rect class="card" width="156" height="100" rx="8"/>
<g transform="translate(12 12)"><path class="ic" d="M0 12h24"/><circle class="dk" cx="12" cy="12" r="5"/></g>
<text class="h" x="44" y="30">Commit</text>
<text class="s m" x="12" y="56">A save point, like</text>
<text class="s m" x="12" y="72">saving a game.</text></g>
<g transform="translate(20 128)"><rect class="card" width="156" height="100" rx="8"/>
<g transform="translate(12 12)"><path class="mn" d="M1 12h22"/><circle class="dm" cx="5" cy="12" r="4"/><circle class="dm" cx="19" cy="12" r="4"/></g>
<text class="h" x="44" y="30">main</text>
<text class="s m" x="12" y="56">The real version</text>
<text class="s m" x="12" y="72">of your project.</text></g>
<g transform="translate(184 128)"><rect class="card" width="156" height="100" rx="8"/>
<g transform="translate(12 12)"><path class="mn" d="M1 19h22"/><path class="br" d="M5 19C10 19 9 6 15 6h8"/><circle class="db" cx="19" cy="6" r="3.5"/></g>
<text class="h" x="44" y="30">Branch</text>
<text class="s m" x="12" y="56">A practice copy for</text>
<text class="s m" x="12" y="72">trying changes</text>
<text class="s m" x="12" y="88">safely.</text></g>
<g transform="translate(20 236)"><rect class="card" width="156" height="100" rx="8"/>
<g transform="translate(12 12)"><path class="ic" d="M4 1h11l5 5v17H4z"/><path class="ok" d="M8 14l3 3 5-6"/></g>
<text class="h" x="44" y="30">Pull request</text>
<text class="s m" x="12" y="56">A permission slip:</text>
<text class="s m" x="12" y="72">may these changes</text>
<text class="s m" x="12" y="88">join main?</text></g>
<g transform="translate(184 236)"><rect class="card" width="156" height="100" rx="8"/>
<g transform="translate(12 12)"><circle class="ic" cx="12" cy="12" r="10"/><path class="ok" d="M7 12l3.5 3.5L17 9"/></g>
<text class="h" x="44" y="30">Check</text>
<text class="s m" x="12" y="56">A robot test:</text>
<text class="s m" x="12" y="72">✓ pass or ✗ fail.</text></g>
<g transform="translate(20 344)"><rect class="card" width="156" height="100" rx="8"/>
<g transform="translate(12 12)"><circle class="ic" cx="10" cy="10" r="7"/><path class="ic" d="M15 15l7 7"/></g>
<text class="h" x="44" y="30">Review</text>
<text class="s m" x="12" y="56">A second AI reads</text>
<text class="s m" x="12" y="72">the change, looking</text>
<text class="s m" x="12" y="88">for mistakes.</text></g>
<g transform="translate(184 344)"><rect class="card" width="156" height="100" rx="8"/>
<g transform="translate(12 12)"><path class="mn" d="M1 19h22"/><path class="br" d="M1 5h5c6 0 6 14 12 14"/><circle class="dm" cx="19" cy="19" r="4"/></g>
<text class="h" x="44" y="30">Merge</text>
<text class="s m" x="12" y="56">The changes join</text>
<text class="s m" x="12" y="72">main. With Ask, it</text>
<text class="s m" x="12" y="88">waits for your yes.</text></g>
</svg>
