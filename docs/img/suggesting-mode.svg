<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 390" width="360" role="img" aria-labelledby="t d">
<title id="t">A pull request works like suggesting mode</title>
<desc id="d">Top: a document in Google Docs suggesting mode. A suggestion crosses out 8 am and adds 7 am, both in the suggester's color, and an Accept all button applies it. Bottom: the same edit in a GitHub pull request. Its Files changed tab shows the old line in red and the new line in green, and the Merge pull request button does what Accept all does.</desc>
<style>
.bg{fill:#fff;stroke:#d9e0e7}
text{font-family:ui-sans-serif,-apple-system,"Segoe UI",Helvetica,Arial,sans-serif;fill:#0f1724}
.h{font-size:16px}
.b{font-size:13px;font-weight:600}
.s{font-size:13px}
.l{font-size:11px;letter-spacing:.08em}
.m{fill:#516074}
.c{text-anchor:middle}
.mono{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace}
.card{fill:#f1f4f8;stroke:#8a99ad;stroke-width:1}
.del,.ins{fill:#7c4dbd}
.sk{stroke:#7c4dbd;stroke-width:1.5}
.rm{fill:#fdecea}
.ad{fill:#e3f5ec}
.x{fill:#c2412d;font-weight:700}
.ok{fill:#128a5e;font-weight:700}
.tab{fill:#b87514}
.acc{fill:#2f6fd1}
.btn{fill:#128a5e}
.nt{fill:#fff}
.w{fill:#fff}
@media (prefers-color-scheme:dark){
.bg{fill:#0f1724;stroke:#2a3648}
text{fill:#e6edf5}
.m{fill:#9fb0c3}
.card{fill:#1a2535;stroke:#6b7c93}
.del,.ins{fill:#b48cf2}
.sk{stroke:#b48cf2}
.x{fill:#f07a62}
.ok{fill:#3ccf92}
.rm{fill:#3d1712}
.ad{fill:#0e3d2c}
.tab{fill:#e0a13a}
.acc{fill:#6ea2ff}
.nt{fill:#0f1724}
}
</style>
<rect class="bg" x="0.5" y="0.5" width="359" height="389" rx="10"/>
<rect class="card" x="20" y="20" width="320" height="144" rx="8"/>
<text class="l m" x="38" y="44">GOOGLE DOCS · SUGGESTING MODE</text>
<text class="h" x="38" y="80">Doors open at</text>
<text class="h del" x="148" y="80" textLength="35" lengthAdjust="spacingAndGlyphs">8 am</text>
<path class="sk" d="M146 74.5H185"/>
<text class="h ins" x="192" y="80" textLength="35" lengthAdjust="spacingAndGlyphs">7 am</text>
<path class="sk" d="M192 83H227"/>
<text class="s m" x="38" y="104">Crossed out is removed. Colored is added.</text>
<rect class="acc" x="38" y="120" width="100" height="28" rx="6"/>
<text class="b nt c" x="88" y="139">Accept all</text>
<text class="s m" x="150" y="139">applies the suggestions</text>
<text class="s m c" x="180" y="188">The same idea on GitHub ↓</text>
<rect class="card" x="20" y="200" width="320" height="170" rx="8"/>
<text class="l m" x="38" y="224">GITHUB · PULL REQUEST</text>
<text class="b" x="38" y="250">Files changed</text>
<rect class="tab" x="38" y="257" width="88" height="3" rx="1.5"/>
<rect class="rm" x="38" y="268" width="286" height="24"/>
<text class="s mono" x="46" y="285"><tspan class="x">−</tspan> Doors open at 8 am</text>
<rect class="ad" x="38" y="292" width="286" height="24"/>
<text class="s mono" x="46" y="309"><tspan class="ok">+</tspan> Doors open at 7 am</text>
<rect class="btn" x="38" y="330" width="150" height="28" rx="6"/>
<text class="b w c" x="113" y="349">Merge pull request</text>
<text class="s m" x="200" y="349">= Accept all</text>
</svg>
