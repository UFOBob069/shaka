<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 608" width="360" role="img" aria-labelledby="t d">
<title id="t">The parts of a Shaka pull request</title>
<desc id="d">A pull request page titled Count button clicks, marked Open with the label awaiting-merge-approval. Its Files changed tab counts 5 lines added and 3 removed. One: Recommendation: Merge, beside links to the Code Walkthrough, a guided tour of the changed code; Code Review, the second AI's findings; and Checkpoint, a final look at whether it is ready. Two: the summary says what changed and why, in plain words. Three: the intent says why the change exists and why it is safe. Four: a table of checks with each result and its evidence, such as tests passing and two small review suggestions noted. Five: usage and cost, an estimate at API prices rather than your bill. Six: the merge button, which works like Accept all in Google Docs; with Ask, the agent waits for your yes.</desc>
