<text class="s" x="66" y="380">Review</text>
<text class="s" x="126" y="380"><tspan class="ok">✓</tspan> 2 nits noted</text>
<text class="s lnk" x="234" y="380">Comment</text>
<text class="s m" x="58" y="406">What was checked, with proof.</text>
<circle class="n" cx="38" cy="440" r="10"/><text class="nt c" x="38" y="444">5</text>
<text class="b" x="58" y="444">▸ Usage and cost</text>
<text class="s m" x="58" y="464">An estimate at API prices, not your bill.</text>
<circle class="n" cx="38" cy="502" r="10"/><text class="nt c" x="38" y="506">6</text>
<rect class="btn" x="58" y="486" width="150" height="32" rx="6"/>
<text class="b w c" x="133" y="507">Merge pull request</text>
<text class="s m" x="220" y="507">= Accept all</text>
<text class="s m" x="58" y="540">With Ask, the agent waits for your yes.</text>
