<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 556" width="360" role="img" aria-labelledby="t d">
<title id="t">The parts of a Shaka pull request</title>
<desc id="d">A pull request page titled Count button clicks, marked Open with the label awaiting-merge-approval. One: the summary says what changed and why, in plain words. Two: the checkpoint is a final look at whether it is ready and what happens next. Three: the Code Walkthrough link opens a guided tour of the changed code. Four: a table shows what ran on this exact version, such as tests passing and one review problem fixed. Five: usage and cost show what the AI work cost, when reported. Six: the merge button; with Ask, the agent waits for your yes.</desc>
<style>
.bg{fill:#fff;stroke:#d9e0e7}
text{font-family:ui-sans-serif,-apple-system,"Segoe UI",Helvetica,Arial,sans-serif;fill:#0f1724}
.h{font-size:15px;font-weight:600}
.b{font-size:13px;font-weight:600}
.s{font-size:13px}
.t{font-size:11px}
.m{fill:#516074}
.c{text-anchor:middle}
.page{fill:#fff;stroke:#8a99ad}
.bar{fill:#f1f4f8}
.ln{stroke:#d9e0e7;stroke-width:1}
.dot{fill:#8a99ad}
.n{fill:#2f6fd1}
.nt{fill:#fff;font-size:11px;font-weight:700}
.open{fill:#128a5e}
.lab{fill:#fdf3df;stroke:#b87514}
.lnk{fill:#2f6fd1;text-decoration:underline}
.tbl{fill:none;stroke:#8a99ad}
.ok{fill:#128a5e;font-weight:700}
.btn{fill:#128a5e}
.w{fill:#fff}
@media (prefers-color-scheme:dark){
.bg{fill:#0f1724;stroke:#2a3648}
text{fill:#e6edf5}
.m{fill:#9fb0c3}
.page{fill:#1a2535;stroke:#6b7c93}
.bar{fill:#24324a}
.ln{stroke:#2a3648}
.dot{fill:#6b7c93}
.n{fill:#6ea2ff}
.nt{fill:#0f1724}
.lab{fill:#40300f;stroke:#e0a13a}
.lnk{fill:#6ea2ff}
.tbl{stroke:#6b7c93}
.ok{fill:#3ccf92}
.w{fill:#fff}
}
</style>
<rect class="bg" x="0.5" y="0.5" width="359" height="555" rx="10"/>
<rect class="page" x="20" y="20" width="320" height="516" rx="8"/>
<path class="bar" d="M28 21h304a7 7 0 0 1 7 7v22H21V28a7 7 0 0 1 7-7z"/>
<circle class="dot" cx="36" cy="35" r="4"/><circle class="dot" cx="48" cy="35" r="4"/><circle class="dot" cx="60" cy="35" r="4"/>
<text class="t m" x="76" y="39">github.com · Pull request #1</text>
<text class="h" x="38" y="78">Count button clicks #1</text>
<rect class="open" x="38" y="90" width="48" height="20" rx="10"/>
<text class="t w c" x="62" y="104">Open</text>
<rect class="lab" x="94" y="90" width="176" height="20" rx="10"/>
<text class="t c" x="182" y="104">awaiting-merge-approval</text>
<path class="ln" d="M21 122H339"/>
<circle class="n" cx="38" cy="146" r="10"/><text class="nt c" x="38" y="150">1</text>
<text class="b" x="58" y="150">Summary</text>
<text class="s m" x="58" y="170">What changed and why, in plain words.</text>
<circle class="n" cx="38" cy="210" r="10"/><text class="nt c" x="38" y="214">2</text>
<text class="b" x="58" y="214">Checkpoint: Ready to merge</text>
<text class="s m" x="58" y="234">Final look: is it ready, and what next?</text>
<circle class="n" cx="38" cy="274" r="10"/><text class="nt c" x="38" y="278">3</text>
<text class="s lnk" x="58" y="278">Code Walkthrough · Checkpoint</text>
<text class="s m" x="58" y="298">A guided tour of the changed code.</text>
<circle class="n" cx="38" cy="338" r="10"/><text class="nt c" x="38" y="342">4</text>
<rect class="tbl" x="58" y="324" width="266" height="46" rx="4"/>
<path class="tbl" d="M58 347H324M136 324V370"/>
<text class="s" x="66" y="341">Tests</text>
<text class="s" x="144" y="341"><tspan class="ok">✓</tspan> pass at a1b2c3d</text>
<text class="s" x="66" y="364">Review</text>
<text class="s" x="144" y="364"><tspan class="ok">✓</tspan> 1 problem fixed</text>
<text class="s m" x="58" y="390">What ran on this exact version.</text>
<circle class="n" cx="38" cy="424" r="10"/><text class="nt c" x="38" y="428">5</text>
<text class="b" x="58" y="428">▸ Usage and cost</text>
<text class="s m" x="58" y="448">What the AI work cost, when reported.</text>
<circle class="n" cx="38" cy="486" r="10"/><text class="nt c" x="38" y="490">6</text>
<rect class="btn" x="58" y="470" width="150" height="32" rx="6"/>
<text class="b w c" x="133" y="491">Merge pull request</text>
<text class="s m" x="58" y="524">With Ask, the agent waits for your yes.</text>
</svg>
