version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      # CodeQL fails unless init and analyze run the same release.
      codeql-action:
        patterns:
          - "github/codeql-action*"
  - package-ecosystem: bundler
    directory: /
    schedule:
      interval: weekly
